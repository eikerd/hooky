<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Background -->
  <rect width="256" height="256" fill="#1a1a1a" rx="32"/>

  <!-- Hook shape -->
  <g transform="translate(128, 128)">
    <!-- Hook curve -->
    <path d="M 0,-60 Q 40,-60 40,-20 Q 40,20 0,20 Q -40,20 -40,-20"
          fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Hook point -->
    <circle cx="0" cy="20" r="4" fill="#ffffff"/>

    <!-- Decorative accent -->
    <circle cx="-45" cy="-20" r="6" fill="#4f46e5" opacity="0.8"/>
  </g>

  <!-- Subtle gradient effect -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a3e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="256" height="256" fill="url(#grad)" rx="32" opacity="0.3"/>
</svg>
